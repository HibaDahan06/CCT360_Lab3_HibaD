<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset=""UTF-8">
    <title>Photo Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Sequencing</h1>

    <p> Click the button and watch how the story changes depending on the order of the images! </p>

    <div class="images">
        <img
            id="image1"
            src="images/image1.jpg"
            alt="Sad person" 
        >

        <img
            id="image2"
            src="images/image2.jpg"
            alt="People hugging"
        >

        <img
            id="image3"
            src="images/image3.jpg"
            alt="Happy person"
        >
    </div>

    <br>

    <button id="sequence1">Sequence One</button>
    <button id="sequence2">Sequence Two</button>
    <script src="script.js"></script>


</body>
</html>
